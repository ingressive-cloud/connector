# Development docker-compose for the Ingressive connector.
# Copy the environment values from the Setup tab on your connector's detail page.
services:
  connector:
    build: .
    restart: unless-stopped
    environment:
      INGRESSIVE_API_URL: ${INGRESSIVE_API_URL:-http://api-dev:8080}
      INGRESSIVE_API_KEY_ID: ${INGRESSIVE_API_KEY_ID}
      INGRESSIVE_API_KEY_SECRET: ${INGRESSIVE_API_KEY_SECRET}
      # Only needed on first boot — omit after identity.json is written to the volume.
      ENROLLMENT_JWT: ${ENROLLMENT_JWT:-}
      INGRESSIVE_INSTANCE_LABEL: ${INGRESSIVE_INSTANCE_LABEL:-}
    volumes:
      - ingressive-identity:/etc/ingressive
    networks:
      - bifrost

volumes:
  identity:

networks:
  bifrost:
    external: true
    name: bifrost_default
